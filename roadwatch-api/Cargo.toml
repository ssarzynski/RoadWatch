[package]
name = "roadwatch-api"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
roadwatch-q-ledger = { path = "../q-ledger" }
roadwatch-verification = { path = "../verification-engine" }
roadwatch-image-ingestion = { path = "../image-ingestion" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
time = { version = "0.3", features = ["parsing"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
