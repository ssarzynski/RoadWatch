name: Verification Engine

on:
  push:
    paths:
      - "verification-engine/**"
      - ".github/workflows/rust-verification.yml"
  pull_request:
    paths:
      - "verification-engine/**"
      - ".github/workflows/rust-verification.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path verification-engine/Cargo.toml -- --check
      - run: cargo clippy --manifest-path verification-engine/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path verification-engine/Cargo.toml
